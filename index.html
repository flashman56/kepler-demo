<!DOCTYPE html>
<html lang="zh-CN">

  <style>

<body class="relative w-full h-full overflow-hidden">
  <div id="canvas-wrap" class="absolute inset-0 w-full h-full"><canvas id="sim-canvas"></canvas></div>
  <header class="absolute top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="glass rounded-xl px-3 py-2 flex items-center gap-3 pointer-events-auto"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_10px_#38bdf8] animate-pulse"></span><div><div class="text-xs sm:text-sm font-semibold tracking-wider text-slate-100 leading-none">KEPLER <span class="text-sky-400 font-normal">// 引力协奏曲</span></div><div id="telemetry" class="mono text-[10px] text-slate-400 mt-1 flex items-center gap-2.5"><span>天体: <b id="stat-bodies" class="text-slate-200">0</b></span><span>星尘: <b id="stat-dust" class="text-slate-200">0</b></span><span class="hidden sm:inline">演化: <b id="stat-time" class="text-sky-300">0.0</b> yr</span></div></div></div></div>
    <div class="glass rounded-xl p-1 flex items-center gap-1 overflow-x-auto no-scrollbar max-w-full pointer-events-auto"><button data-preset="figure8" class="preset-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white hover:bg-white/5 transition whitespace-nowrap">∞ 三体八字舞</button><button data-preset="solar" class="preset-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white hover:bg-white/5 transition whitespace-nowrap">☀ 太阳系微缩</button><button data-preset="binary" class="preset-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white hover:bg-white/5 transition whitespace-nowrap">✦ 双星吸积盘</button><button data-preset="chaos" class="preset-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white hover:bg-white/5 transition whitespace-nowrap">✧ 星尘大碰撞</button></div>
    <div class="glass rounded-xl p-1 flex items-center gap-1.5 pointer-events-auto"><button id="btn-audio" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-white/10 text-slate-300 hover:bg-white/10 transition flex items-center gap-1.5"><span id="audio-dot" class="w-2 h-2 rounded-full bg-slate-500"></span><span id="audio-label">声景: 关</span></button><select id="scale-select" class="bg-slate-900/90 border border-white/10 text-slate-200 text-xs rounded-lg px-2 py-1.5 outline-none cursor-pointer"><option value="pentatonic">五声音阶</option><option value="lydian">利底亚星云</option><option value="minor">深空低吟</option></select><button id="btn-hud-toggle" title="隐藏/展开控制栏" class="px-2 py-1.5 rounded-lg text-xs border border-white/10 text-slate-300 hover:bg-white/10 transition">面板</button></div>
  </header>
  <div id="hint-banner" class="absolute top-20 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-opacity duration-500"><div class="glass rounded-full px-3.5 py-1 text-[11px] text-sky-200/90 whitespace-nowrap">拖拽空白处弹弓发射新天体 · 双击天体锁定追踪 · 滚轮缩放</div></div>
  <footer id="bottom-dock" class="absolute bottom-3 left-3 right-3 z-20 flex justify-center pointer-events-none transition-all duration-300"><div class="glass rounded-2xl p-2 sm:px-3.5 sm:py-2.5 flex flex-wrap items-center justify-center gap-2 sm:gap-3 max-w-4xl pointer-events-auto">
    <div class="flex items-center gap-1 bg-slate-900/70 p-1 rounded-xl border border-white/5"><button data-tool="slingshot" class="tool-btn btn-active px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent transition">弹弓发射</button><button data-tool="attract" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white transition">引力井</button><button data-tool="repel" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white transition">斥力场</button><button data-tool="pan" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-medium border border-transparent text-slate-300 hover:text-white transition">拖曳视角</button></div>
    <div id="mass-group" class="flex items-center gap-1 bg-slate-900/70 p-1 rounded-xl border border-white/5"><button data-mass="asteroid" class="mass-btn px-2 py-1 rounded-lg text-[11px] font-medium border border-transparent text-slate-300 hover:text-white transition">小行星</button><button data-mass="planet" class="mass-btn btn-active px-2 py-1 rounded-lg text-[11px] font-medium border border-transparent transition">行星</button><button data-mass="star" class="mass-btn px-2 py-1 rounded-lg text-[11px] font-medium border border-transparent text-slate-300 hover:text-white transition">恒星</button><button data-mass="blackhole" class="mass-btn px-2 py-1 rounded-lg text-[11px] font-medium border border-transparent text-slate-300 hover:text-white transition">奇点</button></div>
    <div class="flex items-center gap-2 bg-slate-900/70 px-2.5 py-1.5 rounded-xl border border-white/5"><button id="btn-play" class="w-7 h-7 rounded-lg bg-sky-500/20 border border-sky-400/40 text-sky-300 hover:bg-sky-500/30 flex items-center justify-center text-xs font-bold transition" title="暂停/继续 (Space)">❚❚</button><div class="flex items-center gap-1.5"><span class="text-[11px] text-slate-400">流速</span><input id="speed-slider" type="range" min="0.1" max="3.0" step="0.1" value="1.0" class="w-16 sm:w-20" /><span id="speed-val" class="mono text-[11px] text-sky-300 w-8 text-right">1.0x</span></div></div>
    <div class="flex items-center gap-1"><button id="btn-grid" class="toggle-btn btn-active px-2.5 py-1.5 rounded-lg text-[11px] font-medium border border-white/10 transition">时空网格</button><button id="btn-trails" class="toggle-btn btn-active px-2.5 py-1.5 rounded-lg text-[11px] font-medium border border-white/10 transition">轨道尾迹</button><button id="btn-center" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium border border-white/10 text-slate-300 hover:bg-white/10 transition" title="视角回正">回正</button><button id="btn-clear" class="px-2.5 py-1.5 rounded-lg text-[11px] font-medium border border-rose-500/30 text-rose-300 hover:bg-rose-500/15 transition">清空</button></div>
  </div></footer>
<script>
(() => {
'use strict';
const canvas=document.getElementById('sim-canvas'),ctx=canvas.getContext('2d'),wrap=document.getElementById('canvas-wrap');
const statBodies=document.getElementById('stat-bodies'),statDust=document.getElementById('stat-dust'),statTime=document.getElementById('stat-time'),hintBanner=document.getElementById('hint-banner'),bottomDock=document.getElementById('bottom-dock');
let width=0,height=0,dpr=1;
function resizeCanvas(){dpr=Math.min(window.devicePixelRatio||1,2);width=wrap.clientWidth;height=wrap.clientHeight;canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);initBackgroundStars();}
const SCALES={pentatonic:[130.81,146.83,164.81,196,220,261.63,293.66,329.63,392,440,523.25,587.33,659.25],lydian:[130.81,146.83,164.81,185,196,220,246.94,261.63,293.66,329.63,369.99,392,440],minor:[110,123.47,130.81,146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63,392]};
const audio={ctx:null,master:null,delay:null,enabled:false,scale:'pentatonic',lastNoteAt:0};
function initAudio(){if(audio.ctx)return;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;audio.ctx=new AudioCtx();const comp=audio.ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;audio.master=audio.ctx.createGain();audio.master.gain.value=.45;audio.delay=audio.ctx.createDelay(1);audio.delay.delayTime.value=.38;const fb=audio.ctx.createGain();fb.gain.value=.42;const lp=audio.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;audio.delay.connect(lp);lp.connect(fb);fb.connect(audio.delay);lp.connect(comp);audio.master.connect(comp);audio.master.connect(audio.delay);comp.connect(audio.ctx.destination);}
function toggleAudio(){initAudio();if(!audio.ctx)return;if(audio.ctx.state==='suspended')audio.ctx.resume();audio.enabled=!audio.enabled;const dot=document.getElementById('audio-dot'),label=document.getElementById('audio-label'),btn=document.getElementById('btn-audio');if(audio.enabled){dot.className='w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]';label.textContent='声景: 开';btn.classList.add('btn-active');playChime(523.25,0,.14,1.2);}else{dot.className='w-2 h-2 rounded-full bg-slate-500';label.textContent='声景: 关';btn.classList.remove('btn-active');}}
function playChime(freq,pan=0,vol=.12,dur=1.6){if(!audio.enabled||!audio.ctx)return;const now=audio.ctx.currentTime;if(now-audio.lastNoteAt<.045)return;audio.lastNoteAt=now;const osc=audio.ctx.createOscillator(),mod=audio.ctx.createOscillator(),modGain=audio.ctx.createGain(),env=audio.ctx.createGain(),panner=audio.ctx.createStereoPanner?audio.ctx.createStereoPanner():null;osc.type='sine';osc.frequency.setValueAtTime(freq,now);mod.type='triangle';mod.frequency.setValueAtTime(freq*2,now);modGain.gain.setValueAtTime(freq*.28,now);modGain.gain.exponentialRampToValueAtTime(.01,now+dur*.5);env.gain.setValueAtTime(.0001,now);env.gain.linearRampToValueAtTime(vol,now+.015);env.gain.exponentialRampToValueAtTime(.0001,now+dur);mod.connect(modGain);modGain.connect(osc.frequency);osc.connect(env);if(panner){panner.pan.value=Math.max(-.9,Math.min(.9,pan));env.connect(panner);panner.connect(audio.master);}else env.connect(audio.master);osc.start(now);mod.start(now);osc.stop(now+dur+.05);mod.stop(now+dur+.05);}
function playImpact(mass){if(!audio.enabled||!audio.ctx)return;const now=audio.ctx.currentTime,osc=audio.ctx.createOscillator(),env=audio.ctx.createGain();osc.type='sine';const base=Math.max(42,130-Math.log10(mass+1)*18);osc.frequency.setValueAtTime(base*1.8,now);osc.frequency.exponentialRampToValueAtTime(base*.5,now+.65);env.gain.setValueAtTime(.001,now);env.gain.linearRampToValueAtTime(.28,now+.02);env.gain.exponentialRampToValueAtTime(.0001,now+.8);osc.connect(env);env.connect(audio.master);osc.start(now);osc.stop(now+.85);}
const G=1,SOFTENING=8,MAX_TRAIL=90,MAX_DUST=1200;
const MASS_PRESETS={asteroid:{mass:18,radius:3.5,color:'#94a3b8',glow:'rgba(148,163,184,0.4)',isStar:false,isBH:false},planet:{mass:160,radius:7.5,color:'#38bdf8',glow:'rgba(56,189,248,0.55)',isStar:false,isBH:false},star:{mass:1800,radius:15,color:'#fbbf24',glow:'rgba(251,191,36,0.8)',isStar:true,isBH:false},blackhole:{mass:6500,radius:13,color:'#020617',glow:'rgba(168,85,247,0.9)',isStar:false,isBH:true}};
const PLANET_PALETTE=['#38bdf8','#34d399','#a78bfa','#f472b6','#fb7185','#60a5fa','#2dd4bf','#facc15'];let bodies=[],dust=[],shockwaves=[],bgStars=[];
const state={running:true,timeScale:1,simTime:0,tool:'slingshot',massClass:'planet',showGrid:true,showTrails:true,followId:null,activePreset:'figure8',cam:{x:0,y:0,zoom:1}};
const pointer={down:false,id:null,startX:0,startY:0,curX:0,curY:0,worldX:0,worldY:0,lastPanX:0,lastPanY:0};let nextBodyId=1;
function createBody(o){return{id:nextBodyId++,x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,ax:0,ay:0,mass:o.mass,radius:o.radius,color:o.color||'#38bdf8',glow:o.glow||'rgba(56,189,248,0.5)',isStar:!!o.isStar,isBH:!!o.isBH,trail:[],lastDist:Infinity,prevDist:Infinity,noteCooldown:0};}
function spawnDustRing(cx,cy,count,rMin,rMax,centralMass,cw=1){for(let i=0;i<count;i++){if(dust.length>=MAX_DUST)break;const angle=Math.random()*Math.PI*2,r=rMin+Math.random()*(rMax-rMin),speed=Math.sqrt(G*centralMass/Math.max(r,12))*(.94+Math.random()*.12),tx=-Math.sin(angle)*cw,ty=Math.cos(angle)*cw;dust.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r,vx:tx*speed,vy:ty*speed,color:Math.random()>.35?'#7dd3fc':'#fde68a',alpha:.35+Math.random()*.55,size:1+Math.random()*1.4});}}
function spawnExplosionDust(x,y,vx,vy,color,count=28){for(let i=0;i<count;i++){if(dust.length>=MAX_DUST)dust.shift();const ang=Math.random()*Math.PI*2,spd=.6+Math.random()*3.2;dust.push({x:x+Math.cos(ang)*4,y:y+Math.sin(ang)*4,vx:vx+Math.cos(ang)*spd,vy:vy+Math.sin(ang)*spd,color,alpha:.9,size:1.2+Math.random()*1.8});}}
function initBackgroundStars(){bgStars=[];const count=Math.min(260,Math.floor(width*height/4800));for(let i=0;i<count;i++)bgStars.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.4+.3,a:Math.random()*.6+.15,twinkle:Math.random()*Math.PI*2});}
function loadPreset(name){bodies=[];dust=[];shockwaves=[];state.simTime=0;state.followId=null;state.activePreset=name;state.cam={x:0,y:0,zoom:1};document.querySelectorAll('.preset-btn').forEach(btn=>btn.classList.toggle('btn-active',btn.dataset.preset===name));if(name==='figure8'){const S=175,V=Math.sqrt(1000/S),x1=.97000436*S,y1=-.24308753*S,vx3=-.93240737*V,vy3=-.86473146*V,m=1000;bodies.push(createBody({x:x1,y:y1,vx:-vx3/2,vy:-vy3/2,mass:m,radius:11,color:'#38bdf8',glow:'rgba(56,189,248,0.8)',isStar:true}));bodies.push(createBody({x:-x1,y:-y1,vx:-vx3/2,vy:-vy3/2,mass:m,radius:11,color:'#f472b6',glow:'rgba(244,114,182,0.8)',isStar:true}));bodies.push(createBody({x:0,y:0,vx:vx3,vy:vy3,mass:m,radius:11,color:'#fbbf24',glow:'rgba(251,191,36,0.85)',isStar:true}));spawnDustRing(0,0,140,220,340,3000,1);state.cam.zoom=Math.min(1,Math.min(width,height)/620);}else if(name==='solar'){const sunMass=4500;bodies.push(createBody({x:0,y:0,vx:0,vy:0,mass:sunMass,radius:20,color:'#fbbf24',glow:'rgba(251,191,36,0.9)',isStar:true}));const orbits=[{r:78,m:14,rad:4.5,c:'#94a3b8'},{r:128,m:45,rad:7,c:'#38bdf8'},{r:192,m:35,rad:6.2,c:'#fb7185'},{r:270,m:150,rad:11,c:'#f59e0b'},{r:360,m:85,rad:9,c:'#a78bfa'}];orbits.forEach((o,idx)=>{const ang=idx*1.35,v=Math.sqrt(G*sunMass/o.r),px=Math.cos(ang)*o.r,py=Math.sin(ang)*o.r,vx=-Math.sin(ang)*v,vy=Math.cos(ang)*v;bodies.push(createBody({x:px,y:py,vx,vy,mass:o.m,radius:o.rad,color:o.c,glow:o.c+'88'}));if(idx===3){const mr=22,mv=Math.sqrt(G*o.m/mr);bodies.push(createBody({x:px+mr,y:py,vx,vy:vy+mv,mass:2,radius:2.8,color:'#e2e8f0',glow:'rgba(226,232,240,0.5)'}));}});spawnDustRing(0,0,380,215,245,sunMass,1);state.cam.zoom=Math.min(1,Math.min(width,height)/820);}else if(name==='binary'){const m=3800,sep=110,v=Math.sqrt(G*m/(4*sep))*1.02;bodies.push(createBody({x:-sep,y:0,vx:0,vy:-v,mass:m,radius:13,color:'#020617',glow:'rgba(168,85,247,0.95)',isBH:true}));bodies.push(createBody({x:sep,y:0,vx:0,vy:v,mass:m,radius:13,color:'#020617',glow:'rgba(56,189,248,0.95)',isBH:true}));spawnDustRing(0,0,750,175,360,m*2,1);state.cam.zoom=Math.min(1,Math.min(width,height)/760);}else if(name==='chaos'){const centerMass=3200;bodies.push(createBody({x:0,y:0,vx:0,vy:0,mass:centerMass,radius:17,color:'#fbbf24',glow:'rgba(251,191,36,0.9)',isStar:true}));for(let i=0;i<28;i++){const ang=Math.random()*Math.PI*2,r=70+Math.random()*270,spd=Math.sqrt(G*centerMass/r)*(.75+Math.random()*.45),m=10+Math.random()*90,rad=Math.max(3.2,Math.pow(m,.34)*1.45),c=PLANET_PALETTE[i%PLANET_PALETTE.length];bodies.push(createBody({x:Math.cos(ang)*r,y:Math.sin(ang)*r,vx:-Math.sin(ang)*spd,vy:Math.cos(ang)*spd,mass:m,radius:rad,color:c,glow:c+'88'}));}spawnDustRing(0,0,500,60,340,centerMass,1);state.cam.zoom=Math.min(1,Math.min(width,height)/760);}}
function computeAccelerations(){for(let i=0;i<bodies.length;i++){bodies[i].ax=0;bodies[i].ay=0;}for(let i=0;i<bodies.length;i++){const bi=bodies[i];for(let j=i+1;j<bodies.length;j++){const bj=bodies[j],dx=bj.x-bi.x,dy=bj.y-bi.y,distSq=dx*dx+dy*dy+SOFTENING*SOFTENING,dist=Math.sqrt(distSq),force=G/(distSq*dist),fx=dx*force,fy=dy*force;bi.ax+=fx*bj.mass;bi.ay+=fy*bj.mass;bj.ax-=fx*bi.mass;bj.ay-=fy*bi.mass;}}}
function stepPhysics(dt){const substeps=4,h=dt/substeps;for(let s=0;s<substeps;s++){computeAccelerations();for(let i=0;i<bodies.length;i++){const b=bodies[i];b.vx+=b.ax*h*.5;b.vy+=b.ay*h*.5;b.x+=b.vx*h;b.y+=b.vy*h;}if(pointer.down&&(state.tool==='attract'||state.tool==='repel')){const dir=state.tool==='attract'?1:-1,wellMass=9500*dir;for(const b of bodies){const dx=pointer.worldX-b.x,dy=pointer.worldY-b.y,d2=dx*dx+dy*dy+900,inv=G*wellMass/(d2*Math.sqrt(d2));b.vx+=dx*inv*h;b.vy+=dy*inv*h;}}computeAccelerations();for(const b of bodies){b.vx+=b.ax*h*.5;b.vy+=b.ay*h*.5;}for(let i=0;i<bodies.length;i++){for(let j=i+1;j<bodies.length;j++){const bi=bodies[i],bj=bodies[j],dx=bj.x-bi.x,dy=bj.y-bi.y,minDist=(bi.radius+bj.radius)*.85;if(dx*dx+dy*dy<minDist*minDist){const big=bi.mass>=bj.mass?bi:bj,small=bi.mass>=bj.mass?bj:bi,totalMass=big.mass+small.mass;big.vx=(big.vx*big.mass+small.vx*small.mass)/totalMass;big.vy=(big.vy*big.mass+small.vy*small.mass)/totalMass;big.x=(big.x*big.mass+small.x*small.mass)/totalMass;big.y=(big.y*big.mass+small.y*small.mass)/totalMass;big.mass=totalMass;if(!big.isBH)big.radius=Math.min(34,Math.pow(big.radius**3+small.radius**3,1/3));if(totalMass>1400&&!big.isBH){big.isStar=true;big.color='#fbbf24';big.glow='rgba(251,191,36,0.85)';}shockwaves.push({x:big.x,y:big.y,r:big.radius,maxR:big.radius*7+45,alpha:.9,color:small.color});spawnExplosionDust(small.x,small.y,big.vx,big.vy,small.color,32);playImpact(totalMass);if(state.followId===small.id)state.followId=big.id;const removeIdx=bodies.indexOf(small);if(removeIdx!==-1)bodies.splice(removeIdx,1);j--;}}}}
for(let i=dust.length-1;i>=0;i--){const p=dust[i];let ax=0,ay=0,absorbed=false;for(const b of bodies){const dx=b.x-p.x,dy=b.y-p.y,d2=dx*dx+dy*dy+SOFTENING*SOFTENING;if(d2<b.radius*b.radius){absorbed=true;break;}const f=G*b.mass/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}if(absorbed){dust.splice(i,1);continue;}if(pointer.down&&(state.tool==='attract'||state.tool==='repel')){const dir=state.tool==='attract'?1:-1,dx=pointer.worldX-p.x,dy=pointer.worldY-p.y,d2=dx*dx+dy*dy+600,f=G*9500*dir/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}p.vx+=ax*dt;p.vy+=ay*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
let primary=null;for(const b of bodies)if(!primary||b.mass>primary.mass)primary=b;for(const b of bodies){if(state.showTrails){const last=b.trail[b.trail.length-1];if(!last||(b.x-last.x)**2+(b.y-last.y)**2>9){b.trail.push({x:b.x,y:b.y});if(b.trail.length>MAX_TRAIL)b.trail.shift();}}if(b.noteCooldown>0)b.noteCooldown-=dt;if(primary&&b!==primary&&b.noteCooldown<=0){const dx=b.x-primary.x,dy=b.y-primary.y,d=Math.hypot(dx,dy);if(b.lastDist<b.prevDist&&b.lastDist<d&&d<520){const scale=SCALES[audio.scale]||SCALES.pentatonic,spd=Math.hypot(b.vx,b.vy),idx=Math.min(scale.length-1,Math.max(0,Math.floor(spd/6.5*scale.length))),sx=worldToScreen(b.x,b.y).x,pan=sx/Math.max(1,width)*2-1;playChime(scale[idx],pan,.09,1.5);b.noteCooldown=.55;}b.prevDist=b.lastDist;b.lastDist=d;}}for(let i=shockwaves.length-1;i>=0;i--){const sw=shockwaves[i];sw.r+=(sw.maxR-sw.r)*.12+1.2;sw.alpha*=.93;if(sw.alpha<.03)shockwaves.splice(i,1);}state.simTime+=dt*.1;}
function screenToWorld(sx,sy){return{x:(sx-width/2)/state.cam.zoom+state.cam.x,y:(sy-height/2)/state.cam.zoom+state.cam.y};}
function worldToScreen(wx,wy){return{x:(wx-state.cam.x)*state.cam.zoom+width/2,y:(wy-state.cam.y)*state.cam.zoom+height/2};}
function predictTrajectory(x0,y0,vx0,vy0,steps=110){const pts=[{x:x0,y:y0}];let x=x0,y=y0,vx=vx0,vy=vy0;const h=.35;for(let s=0;s<steps;s++){let ax=0,ay=0;for(const b of bodies){const dx=b.x-x,dy=b.y-y,d2=dx*dx+dy*dy+SOFTENING*SOFTENING,f=G*b.mass/(d2*Math.sqrt(d2));ax+=dx*f;ay+=dy*f;}vx+=ax*h;vy+=ay*h;x+=vx*h;y+=vy*h;pts.push({x,y});}return pts;}
function drawSpacetimeGrid(){const spacing=58,halfW=width/2/state.cam.zoom+spacing*2,halfH=height/2/state.cam.zoom+spacing*2,startX=Math.floor((state.cam.x-halfW)/spacing)*spacing,endX=Math.ceil((state.cam.x+halfW)/spacing)*spacing,startY=Math.floor((state.cam.y-halfH)/spacing)*spacing,endY=Math.ceil((state.cam.y+halfH)/spacing)*spacing,cols=Math.floor((endX-startX)/spacing)+1,rows=Math.floor((endY-startY)/spacing)+1;if(cols*rows>1800)return;const gridPts=new Array(rows);for(let r=0;r<rows;r++){gridPts[r]=new Array(cols);const wy=startY+r*spacing;for(let c=0;c<cols;c++){const wx=startX+c*spacing;let dxTotal=0,dyTotal=0;for(const b of bodies){const dx=b.x-wx,dy=b.y-wy,d2=dx*dx+dy*dy+1600,pull=Math.min(.68,b.mass*.42/d2);dxTotal+=dx*pull;dyTotal+=dy*pull;}gridPts[r][c]=worldToScreen(wx+dxTotal,wy+dyTotal);}}ctx.lineWidth=1;ctx.strokeStyle='rgba(56, 189, 248, 0.11)';ctx.beginPath();for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const p=gridPts[r][c];if(c+1<cols){const pr=gridPts[r][c+1];ctx.moveTo(p.x,p.y);ctx.lineTo(pr.x,pr.y);}if(r+1<rows){const pd=gridPts[r+1][c];ctx.moveTo(p.x,p.y);ctx.lineTo(pd.x,pd.y);}}ctx.stroke();}
function render(nowMs){if(state.followId!==null){const target=bodies.find(b=>b.id===state.followId);if(target){state.cam.x+=(target.x-state.cam.x)*.15;state.cam.y+=(target.y-state.cam.y)*.15;}else state.followId=null;}ctx.fillStyle='#04060d';ctx.fillRect(0,0,width,height);const t=nowMs*.0015;for(const st of bgStars){const alpha=st.a*(.65+.35*Math.sin(t+st.twinkle));ctx.fillStyle=`rgba(226, 232, 240, ${alpha.toFixed(2)})`;ctx.fillRect(st.x,st.y,st.r,st.r);}if(state.showGrid)drawSpacetimeGrid();for(const p of dust){const s=worldToScreen(p.x,p.y);if(s.x< -10||s.x>width+10||s.y< -10||s.y>height+10)continue;ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;const sz=Math.max(1,p.size*state.cam.zoom);ctx.fillRect(s.x-sz*.5,s.y-sz*.5,sz,sz);}ctx.globalAlpha=1;if(state.showTrails){for(const b of bodies){if(b.trail.length<2)continue;ctx.lineWidth=Math.max(1.1,Math.min(2.6,b.radius*.22*state.cam.zoom));for(let k=1;k<b.trail.length;k++){const p0=worldToScreen(b.trail[k-1].x,b.trail[k-1].y),p1=worldToScreen(b.trail[k].x,b.trail[k].y);ctx.strokeStyle=b.isBH?'#a855f7':b.color;ctx.globalAlpha=k/b.trail.length*.55;ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();}}ctx.globalAlpha=1;}for(const sw of shockwaves){const s=worldToScreen(sw.x,sw.y);ctx.strokeStyle=sw.color;ctx.globalAlpha=sw.alpha;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,sw.r*state.cam.zoom,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;for(const b of bodies){const s=worldToScreen(b.x,b.y),r=Math.max(2.5,b.radius*state.cam.zoom);if(s.x< -r*4||s.x>width+r*4||s.y< -r*4||s.y>height+r*4)continue;const glowR=r*(b.isBH?3.4:b.isStar?3.2:2.3),grad=ctx.createRadialGradient(s.x,s.y,r*.2,s.x,s.y,glowR);grad.addColorStop(0,b.isBH?'rgba(168,85,247,0.85)':b.glow);grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(s.x,s.y,glowR,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();if(b.isBH){ctx.strokeStyle='rgba(216, 180, 254, 0.9)';ctx.lineWidth=1.6;ctx.stroke();}if(state.followId===b.id){ctx.strokeStyle='#38bdf8';ctx.lineWidth=1.2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(s.x,s.y,r+7,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}}
if(pointer.down&&state.tool==='slingshot'){const wStart=screenToWorld(pointer.startX,pointer.startY),wCur=screenToWorld(pointer.curX,pointer.curY),vx=(wStart.x-wCur.x)*.045,vy=(wStart.y-wCur.y)*.045,pts=predictTrajectory(wStart.x,wStart.y,vx,vy,110);ctx.strokeStyle='rgba(125, 211, 252, 0.72)';ctx.lineWidth=1.6;ctx.setLineDash([5,5]);ctx.beginPath();for(let i=0;i<pts.length;i++){const sp=worldToScreen(pts[i].x,pts[i].y);if(i===0)ctx.moveTo(sp.x,sp.y);else ctx.lineTo(sp.x,sp.y);}ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='rgba(251, 191, 36, 0.75)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pointer.startX,pointer.startY);ctx.lineTo(pointer.curX,pointer.curY);ctx.stroke();const preset=MASS_PRESETS[state.massClass];ctx.fillStyle=preset.color;ctx.beginPath();ctx.arc(pointer.startX,pointer.startY,preset.radius*state.cam.zoom,0,Math.PI*2);ctx.fill();}if(pointer.down&&(state.tool==='attract'||state.tool==='repel')){const col=state.tool==='attract'?'56, 189, 248':'251, 113, 133',pulse=22+Math.sin(nowMs*.01)*6;ctx.strokeStyle=`rgba(${col}, 0.75)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(pointer.curX,pointer.curY,pulse,0,Math.PI*2);ctx.stroke();}}
let lastFrame=performance.now(),rafId=null;function loop(now){const elapsed=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(state.running)stepPhysics(elapsed*24*state.timeScale);render(now);statBodies.textContent=bodies.length;statDust.textContent=dust.length;statTime.textContent=state.simTime.toFixed(1);rafId=requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.id=e.pointerId;pointer.startX=e.clientX;pointer.startY=e.clientY;pointer.curX=e.clientX;pointer.curY=e.clientY;pointer.lastPanX=e.clientX;pointer.lastPanY=e.clientY;const w=screenToWorld(e.clientX,e.clientY);pointer.worldX=w.x;pointer.worldY=w.y;canvas.setPointerCapture(e.pointerId);hintBanner.style.opacity='0';});
canvas.addEventListener('pointermove',e=>{if(!pointer.down)return;pointer.curX=e.clientX;pointer.curY=e.clientY;const w=screenToWorld(e.clientX,e.clientY);pointer.worldX=w.x;pointer.worldY=w.y;if(state.tool==='pan'){state.followId=null;state.cam.x-=(e.clientX-pointer.lastPanX)/state.cam.zoom;state.cam.y-=(e.clientY-pointer.lastPanY)/state.cam.zoom;pointer.lastPanX=e.clientX;pointer.lastPanY=e.clientY;}});
canvas.addEventListener('pointerup',e=>{if(!pointer.down)return;if(state.tool==='slingshot'){const wStart=screenToWorld(pointer.startX,pointer.startY),wCur=screenToWorld(pointer.curX,pointer.curY),vx=(wStart.x-wCur.x)*.045,vy=(wStart.y-wCur.y)*.045,p=MASS_PRESETS[state.massClass],color=state.massClass==='planet'?PLANET_PALETTE[Math.floor(Math.random()*PLANET_PALETTE.length)]:p.color;bodies.push(createBody({x:wStart.x,y:wStart.y,vx,vy,mass:p.mass,radius:p.radius,color,glow:state.massClass==='planet'?color+'88':p.glow,isStar:p.isStar,isBH:p.isBH}));const scale=SCALES[audio.scale]||SCALES.pentatonic;playChime(scale[Math.floor(Math.random()*scale.length)],pointer.startX/width*2-1,.12,1.4);}pointer.down=false;try{canvas.releasePointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('dblclick',e=>{const w=screenToWorld(e.clientX,e.clientY);let hit=null,bestD=36/state.cam.zoom;for(const b of bodies){const d=Math.hypot(b.x-w.x,b.y-w.y)-b.radius;if(d<bestD){bestD=d;hit=b;}}state.followId=hit?(state.followId===hit.id?null:hit.id):null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.1:.9;state.cam.zoom=Math.max(.22,Math.min(3.5,state.cam.zoom*factor));},{passive:false});
document.querySelectorAll('.preset-btn').forEach(btn=>btn.addEventListener('click',()=>loadPreset(btn.dataset.preset)));
const massGroup=document.getElementById('mass-group');document.querySelectorAll('.tool-btn').forEach(btn=>btn.addEventListener('click',()=>{state.tool=btn.dataset.tool;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('btn-active',b===btn));massGroup.style.display=state.tool==='slingshot'?'flex':'none';}));
document.querySelectorAll('.mass-btn').forEach(btn=>btn.addEventListener('click',()=>{state.massClass=btn.dataset.mass;document.querySelectorAll('.mass-btn').forEach(b=>b.classList.toggle('btn-active',b===btn));}));
const btnPlay=document.getElementById('btn-play');function togglePlay(){state.running=!state.running;btnPlay.textContent=state.running?'❚❚':'▶';}btnPlay.addEventListener('click',togglePlay);
const speedSlider=document.getElementById('speed-slider'),speedVal=document.getElementById('speed-val');speedSlider.addEventListener('input',()=>{state.timeScale=parseFloat(speedSlider.value);speedVal.textContent=state.timeScale.toFixed(1)+'x';});
const btnGrid=document.getElementById('btn-grid');btnGrid.addEventListener('click',()=>{state.showGrid=!state.showGrid;btnGrid.classList.toggle('btn-active',state.showGrid);});const btnTrails=document.getElementById('btn-trails');btnTrails.addEventListener('click',()=>{state.showTrails=!state.showTrails;btnTrails.classList.toggle('btn-active',state.showTrails);if(!state.showTrails)bodies.forEach(b=>b.trail=[]);});
document.getElementById('btn-center').addEventListener('click',()=>{state.followId=null;state.cam={x:0,y:0,zoom:1};});document.getElementById('btn-clear').addEventListener('click',()=>{bodies=[];dust=[];shockwaves=[];state.simTime=0;state.followId=null;});document.getElementById('btn-audio').addEventListener('click',toggleAudio);document.getElementById('scale-select').addEventListener('change',e=>{audio.scale=e.target.value;});
let dockVisible=true;document.getElementById('btn-hud-toggle').addEventListener('click',()=>{dockVisible=!dockVisible;bottomDock.style.opacity=dockVisible?'1':'0';bottomDock.style.pointerEvents=dockVisible?'auto':'none';});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}});window.addEventListener('resize',resizeCanvas);window.onload=()=>{resizeCanvas();loadPreset('figure8');if(rafId)cancelAnimationFrame(rafId);lastFrame=performance.now();rafId=requestAnimationFrame(loop);};
})();
